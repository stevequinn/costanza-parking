            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);

        input, select, textarea { font-size: 16px; } /* Prevent iOS auto-zoom */

        /* Map Bay Labels */
.bay-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 900;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    border-radius: 4px;

    padding: 3px 7px;
    letter-spacing: -0.3px;
    pointer-events: none;
    transform: translateY(-2px);
}
        
        #loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #57534e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .spinner-sm {
            width: 14px; height: 14px;
            border: 2px solid #d1d5db;
            border-top-color: #57534e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        /* Bottom Sheet Mechanics */
        #bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            border-radius: 24px 24px 0 0;
            max-height: 85vh;
            display: flex; flex-direction: column;
        }
        #bottom-sheet.collapsed { transform: translateY(calc(100% - 110px)); }
        #bottom-sheet.expanded { transform: translateY(0); }
        
        .sheet-content { 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
        }

        .filter-btn.active {
            background-color: #1f2937 !important;
            color: white !important;
        }

.active-marker-pulse {
    width: 28px;
    height: 28px;
    background: rgba(87, 83, 78, 0.5);
    border-radius: 50%;
    position: absolute;
    top: -6px;
    left: -6px;
    animation: pulse 1.5s infinite;
    z-index: -1;
}
@keyframes pulse {
    0% { transform: scale(0.8); opacity: 0.9; }
    100% { transform: scale(2.4); opacity: 0; }
}

        .view-transition {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Staleness Badge */
        #staleness-badge {
            display: inline-flex;

            gap: 5px;
            padding: 3px 8px;

            font-weight: 600;

            width: 6px; height: 6px;

        #staleness-badge.old .dot { background: #ef4444; animation: pulse-dot 1s infinite; }

    <script>
        // --- Utility Functions ---
        function costanzaSvg() {
            return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="circleClip"><circle cx="120" cy="120" r="120"/></clipPath>

  <path d="M 68 96 C 60 108 58 132 66 154 C 70 140 71 128 70 118 C 69 110 70 102 74 98 C 72 96 70 95 68 96 Z" fill="#3B2A20"/>

  <ellipse cx="120" cy="88" rx="36" ry="26" fill="#EDC496" opacity="0.55"/>
  <path d="M 90 106 Q 103 97 117 104 L 115 111 Q 103 105 92 112 Z" fill="#3B2A20"/>
  <path d="M 150 106 Q 137 97 123 104 L 125 111 Q 137 105 148 112 Z" fill="#3B2A20"/>
  <circle cx="101" cy="123" r="4.2" fill="#1A1A1A"/>
  <circle cx="139" cy="123" r="4.2" fill="#1A1A1A"/>
  <path d="M 116 118 Q 112 136 118 142 L 126 140" stroke="#C99A67" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 160 Q 120 153 140 160" stroke="#7A3B2E" stroke-width="4.2" fill="none" stroke-linecap="round"/>
  <rect x="80" y="112" width="35" height="25" rx="6" fill="none" stroke="#1A1A1A" stroke-width="4.5"/>
  <rect x="125" y="112" width="35" height="25" rx="6" fill="none" stroke="#1A1A1A" stroke-width="4.5"/>
  <line x1="115" y1="123" x2="125" y2="123" stroke="#1A1A1A" stroke-width="4.5"/>
  <line x1="80" y1="121" x2="67" y2="116" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="160" y1="121" x2="173" y2="116" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 78 208 L 110 186 L 120 202 L 130 186 L 162 208 L 162 240 L 78 240 Z" fill="#F5ECD9"/>
  <path d="M 55 222 Q 120 194 185 222 L 185 240 L 55 240 Z" fill="#B5482D"/>
</g>
</svg>`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function formatDateTime(isoStr) {
            if (!isoStr) return 'N/A';
            try {
                const date = new Date(isoStr);
                return date.toLocaleString(undefined, {
                    month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', hour12: true
                });
            } catch (e) { return isoStr; }
        }

        // Time logic to determine active restriction
        function getMelbourneTimeData() {
            const now = new Date();
            const melbDateString = now.toLocaleString("en-US", { timeZone: "Australia/Melbourne" });
            const melbNow = new Date(melbDateString);
            return {
                day: melbNow.getDay(), // 0=Sun, 1=Mon, ..., 6=Sat
                time: melbNow.getHours() + (melbNow.getMinutes() / 60)
            };
        }

        function parseDays(dayStr) {
            const dayMap = { 'Sun': 0, 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6 };
            if (!dayStr) return [0,1,2,3,4,5,6];
            if (dayStr === 'Mon-Sun' || dayStr === 'Everyday') return [0,1,2,3,4,5,6];
            const parts = dayStr.split('-');
            if (parts.length === 2) {
                let start = dayMap[parts[0]];
                let end = dayMap[parts[1]];
                let days = [];
                if (start <= end) {
                    for (let i = start; i <= end; i++) days.push(i);
                } else {
                    for (let i = start; i <= 6; i++) days.push(i);
                    for (let i = 0; i <= end; i++) days.push(i);
                }
                return days;
            }
            return [0,1,2,3,4,5,6];
        }

        function parseTime(timeStr) {
            if (!timeStr || timeStr === '00:00:00') return null;
            const parts = String(timeStr).split(':');
            return parseInt(parts[0], 10) + (parseInt(parts[1], 10) / 60);
        }

        function isCurrentlyActive(r, melbTime) {
            const days = parseDays(r.rawDays);
            if (!days.includes(melbTime.day)) return false;

            const start = parseTime(r.rawStart);
            const end = parseTime(r.rawEnd);
            if (start === null || end === null) return true; // All day
            return melbTime.time >= start && melbTime.time <= end;
        }

        // --- IndexedDB Setup ---
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('melbourneParking', 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('static')) db.createObjectStore('static');
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e);
            });
        }

        async function getCached(key) {
            try {
                const db = await openDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction('static', 'readonly');
                    const req = tx.objectStore('static').get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return null; }
        }

        async function setCached(key, value) {
            try {
                const db = await openDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction('static', 'readwrite');
                    tx.objectStore('static').put({ value, timestamp: Date.now() }, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) { console.error('Cache save error', e); }
        }

        // --- Web Worker ---
        const workerCode = `
            let bayByKerbsideId = {};
            let restrictionsByZone = {};

            function decodeRestriction(code) {
                if (!code) return 'Parking';
                const c = String(code).toUpperCase();
                const map = {
                    'P1': '1 Hour Parking', 'P2': '2 Hour Parking', 'P3': '3 Hour Parking', 'P4': '4 Hour Parking', 'P5': '5 Hour Parking',
                    'MP1P': '1 Hour Metered', 'MP2P': '2 Hour Metered', 'MP3P': '3 Hour Metered', 'MP4P': '4 Hour Metered', 'MP5P': '5 Hour Metered',
                    'NP': 'No Parking', 'LT': 'Loading Zone', 'TZ': 'Taxi Zone', 'BZ': 'Bus Zone', 'PER': 'Permit Zone', 'DIS': 'Disability Permit', 'LZ30': 'Loading Zone 30'
                };
                return map[c] || code;
            }

            function formatTime(timeStr) {
                if (!timeStr || timeStr === '00:00:00') return 'All day';
                const parts = String(timeStr).split(':');
                const h = parseInt(parts[0], 10);
                const m = parts[1];
                const period = h >= 12 ? 'PM' : 'AM';
                const hour12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
                return hour12 + ':' + m + ' ' + period;
            }

            self.onmessage = async (e) => {
                const { type, cachedBays, cachedRestrictions } = e.data;
                
                if (type === 'start') {
                    let bays = cachedBays;
                    let restrictions = cachedRestrictions;
                    
                    if (!bays) {
                        postMessage({ type: 'status', text: 'Fetching bays...' });
                        try {
                            const res = await fetch('https://data.melbourne.vic.gov.au/api/v2/catalog/datasets/on-street-parking-bays/exports/geojson');
                            bays = await res.json();
                            postMessage({ type: 'cache', key: 'bays', data: bays });
                        } catch(err) { postMessage({ type: 'error', message: 'Failed to fetch bays' }); return; }
                    }

                    if (!restrictions) {
                        postMessage({ type: 'status', text: 'Fetching restrictions...' });
                        try {
                            const res = await fetch('https://discover.data.vic.gov.au/api/3/action/datastore_search?resource_id=6de857f5-da6a-5382-bb41-d4991fbc6c1f&limit=2500');
                            if (!res.ok) throw new Error('API Error: ' + res.status);
                            const data = await res.json();
                            restrictions = data.result.records;
                            postMessage({ type: 'cache', key: 'restrictions_vic', data: restrictions });
                        } catch(err) { postMessage({ type: 'error', message: 'Failed to fetch restrictions' }); return; }
                    }
                    
                    bays.features.forEach(f => {
                        const p = f.properties || {};
                        const kerbsideId = p.kerbsideid ?? p.kerbside_id ?? null;
                        if (kerbsideId !== null && kerbsideId !== undefined && kerbsideId !== '') {
                            bayByKerbsideId[String(kerbsideId)] = f;
                        }
                    });

                    restrictions.forEach(r => {
                        const zone = r.parkingzone ?? r.parking_zone ?? null;
                        if (zone !== null && zone !== undefined && zone !== '') {
                            const key = String(zone);
                            if (!restrictionsByZone[key]) restrictionsByZone[key] = [];
                            restrictionsByZone[key].push(r);
                        }
                    });
                    
                    await fetchSensors();
                } else if (type === 'reload-sensors') {
                    await fetchSensors();
                }
            };

            async function fetchSensors() {
                postMessage({ type: 'status', text: 'Fetching sensors...' });
                let sensors = [];
                let offset = 0;
                const limit = 100;
                let total = 0;
                
                while (true) {
                    try {
                        const res = await fetch('https://data.melbourne.vic.gov.au/api/explore/v2.1/catalog/datasets/on-street-parking-bay-sensors/records?limit=' + limit + '&offset=' + offset);
                        if (!res.ok) throw new Error('API Error: ' + res.status);
                        const data = await res.json();
                        total = data.total_count || 0;
                        if (data.results && data.results.length > 0) {
                            sensors = sensors.concat(data.results);
                            offset += limit;
                            postMessage({ type: 'status', text: 'Sensors: ' + sensors.length + '/' + total });
                        } else { break; }
                        if (offset >= 10000) break; 
                        if (data.results.length < limit) break;
                    } catch (e) { postMessage({ type: 'error', message: e.message }); break; }
                }

                const enriched = sensors.map(s => {
                    const kerbsideId = String(s.kerbsideid ?? s.kerbside_id ?? s.bay_id ?? s.bayid ?? '');
                    const bayFeature = bayByKerbsideId[kerbsideId] || null;

                    let geometry = null;
                    let roadSegment = 'Unknown road segment';
                    let lat = null, lon = null;
                    
                    if (bayFeature) {
                        geometry = bayFeature.geometry;
                        const bp = bayFeature.properties || {};
                        roadSegment = bp.roadsegmentdescription || bp.road_segment_description || roadSegment;
                        lat = bp.latitude;
                        lon = bp.longitude;
                    }

                    const zoneNumber = s.zone_number ?? s.zone ?? null;
                    let restrictionRecs = [];
                    if (zoneNumber !== null && zoneNumber !== undefined && zoneNumber !== '') {
                        restrictionRecs = restrictionsByZone[String(zoneNumber)] || [];
                    }
                    
                    if (lat == null || lon == null) {
                        lat = s.lat ?? s.latitude;
                        lon = s.lon ?? s.longitude;
                        if (s.location) { lon = s.location.lon ?? lon; lat = s.location.lat ?? lat; }
                    }

                    let status = 'unknown';
                    const st = (s.status_description || s.status || '').toLowerCase();
                    if (st.includes('not present') || st.includes('unoccupied') || st.includes('vacant')) status = 'free';
                    else if (st.includes('present') || st.includes('occupied')) status = 'occupied';

                    const parsedRestrictions = restrictionRecs.map(r => {
                        const display = r.restriction_display || 'P';
                        const days = r.restriction_days || 'Anytime';
                        const startTime = r.time_restrictions_start ? formatTime(r.time_restrictions_start) : '';
                        const endTime = r.time_restrictions_finish ? formatTime(r.time_restrictions_finish) : '';

                        let structured = decodeRestriction(display);
                        if (days && days !== 'Anytime') structured += ' • ' + days;
                        if (startTime && endTime && startTime !== 'All day' && endTime !== 'All day') {
                            structured += ' • ' + startTime + '–' + endTime;
                        }
                        return { 
                            code: display, 
                            structured, 
                            description: display + ' (' + days + ')',
                            rawDays: r.restriction_days,
                            rawStart: r.time_restrictions_start,
                            rawEnd: r.time_restrictions_finish
                        };
                    });

                    let centroid = null;
                    if (geometry) centroid = computeCentroid(geometry);
                    else if (lat && lon) centroid = [lat, lon];

                    return {
                        bayId: kerbsideId,
                        zoneNumber: zoneNumber,
                        status, roadSegment, geometry, centroid, lat, lon,
                        lastupdated: s.lastupdated,
                        status_timestamp: s.status_timestamp,
                        restrictions: parsedRestrictions
                    };
                });

                postMessage({ type: 'data', features: enriched });
                postMessage({ type: 'status', text: 'Updated ' + new Date().toLocaleTimeString() });
            }

            function computeCentroid(geom) {
                try {
                    if (geom.type === 'Polygon') {
                        const coords = geom.coordinates[0];
                        let lat = 0, lon = 0;
                        for (let i = 0; i < coords.length; i++) { lon += coords[i][0]; lat += coords[i][1]; }
                        return [lat / coords.length, lon / coords.length];
                    } else if (geom.type === 'Point') {
                        return [geom.coordinates[1], geom.coordinates[0]];
                    } else if (geom.type === 'MultiPolygon') {
                        const coords = geom.coordinates[0][0];
                        let lat = 0, lon = 0;
                        for (let i = 0; i < coords.length; i++) { lon += coords[i][0]; lat += coords[i][1]; }
                        return [lat / coords.length, lon / coords.length];
                    }
                } catch(e) { return null; }
                return null;
            }
        `;

            badge.style.visibility = 'visible';
            const mins = Math.floor((Date.now() - lastFetchTimestamp) / 60000);
            if (mins < 1) {
                badge.className = 'fresh';
                text.textContent = 'Updated just now';
            } else if (mins < 5) {
                badge.className = 'fresh';
                text.textContent = 'Updated ' + mins + 'm ago';
            } else if (mins < 15) {
                badge.className = 'stale';
                text.textContent = mins + 'm old — tap reload';

            const retryBtn = document.getElementById('error-retry');
            banner.className = 'glass ' + type + '-state';

            } else {
                retryBtn.style.display = 'none';
            }
            requestAnimationFrame(() => banner.classList.add('visible'));
            clearTimeout(errorDismissTimer);
            if (!retryCallback) errorDismissTimer = setTimeout(hideError, 8000);

        async function init() {
            const cachedBays = await getCached('bays');

            const isStale = (cached) => !cached || (Date.now() - cached.timestamp > 7 * 24 * 60 * 60 * 1000);
            worker.postMessage({

            });

        function scheduleRender() {
            if (renderScheduled) return;
            renderScheduled = true;
            const run = () => { renderScheduled = false; render(); };
            if (window.requestIdleCallback) window.requestIdleCallback(run, { timeout: 200 });
            else setTimeout(run, 100);
        }

        function getStatusColor(status) {
            if (status === 'free') return '#10b981';
            if (status === 'occupied') return '#ef4444';
            return '#9ca3af';
        }

        function render() {
            parkingLayer.clearLayers();
            if (!allFeatures || allFeatures.length === 0) { updateVisibleCount(0); return; }
            
            const mapBounds = map.getBounds();
            let inBounds = [];
            
            for (let f of allFeatures) {
                if (f.centroid && mapBounds.contains(L.latLng(f.centroid))) inBounds.push(f);
            }
            
            // Performance limit to prevent browser lag when zoomed out
            const markerLimit = 5000;
            if (inBounds.length > markerLimit) {
                const center = map.getCenter();
                inBounds.sort((a, b) => center.distanceTo(L.latLng(a.centroid)) - center.distanceTo(L.latLng(b.centroid)));
                inBounds = inBounds.slice(0, markerLimit);
            }

            let filteredCount = 0;
            const melbTime = getMelbourneTimeData();
            const showPolygons = map.getZoom() >= 19;
            
            for (let f of inBounds) {
                if (currentFilter !== 'all' && f.status !== currentFilter) continue;
                filteredCount++;
                
                // Determine active code for label
                let activeCode = 'P';
                for (let r of f.restrictions) {
                    if (isCurrentlyActive(r, melbTime)) {
                        activeCode = r.code;
                        break;
                    }
                }

                if (showPolygons) {
                    // Render Polygon if available
                    if (f.geometry && f.geometry.type !== 'Point') {
                        try {
                            const geoJsonLayer = L.geoJSON(f.geometry, {
                    style: { 
                        color: 'white', 
                        weight: 2, 
                        fillColor: getStatusColor(f.status), 
                        fillOpacity: 0.75

                                    lyr.on('click', () => selectBay(f));
                                }
                            });
                            parkingLayer.addLayer(geoJsonLayer);

                    } else {

                const marker = L.circleMarker(L.latLng(f.centroid), {
                    radius: 10,
                    color: 'white',
                    weight: 2,

                </div>
                <div>
                    <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Restrictions</h3>
                    ${restrictionsHtml}
                </div>
                <div class="pt-3 mt-2 text-center text-[10px] sm:text-[11px] text-gray-500 bg-gray-50 rounded-xl px-4 py-3 border border-gray-100 leading-relaxed">Sensor status shows vehicle presence only. Always verify via street signs.</div>
            `;
        }

        function updateStats() {
            let total = allFeatures.length;
            let free = allFeatures.filter(f => f.status === 'free').length;
            let occupied = allFeatures.filter(f => f.status === 'occupied').length;
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-free').innerText = free;
            document.getElementById('stat-occupied').innerText = occupied;
            updateNearbyList();
            updateStalenessBadge();
        }

        function updateNearbyList() {
            const panel = document.getElementById('nearby-panel');
            const list = document.getElementById('nearby-list');
            list.innerHTML = '';
            
            if (!focusPoint) {
                panel.classList.add('hidden');
                return;
            }
            
            panel.classList.remove('hidden');
            const nearby = allFeatures.filter(f => f.centroid && map.distance(focusPoint, L.latLng(f.centroid)) <= 600)
                .map(f => ({ ...f, dist: map.distance(focusPoint, L.latLng(f.centroid)) }))
                .sort((a, b) => a.dist - b.dist);
            
            if (nearby.length === 0) {
                list.innerHTML = '<div class="text-[11px] text-gray-500 text-center py-6 bg-gray-50 rounded-xl">No bays found within 600m</div>';
                return;
            }
            
            nearby.slice(0, 15).forEach(f => {
                const summary = f.restrictions[0] ? f.restrictions[0].structured.split(' • ').slice(0, 2).join(' ') : 'Parking Bay';
                const div = document.createElement('div');
                div.className = 'p-3 rounded-xl bg-white border border-gray-100 active:bg-gray-50 cursor-pointer transition flex justify-between items-center';
                div.innerHTML = `
                    <div class="flex-1 min-w-0 mr-3">
                        <div class="text-sm font-semibold text-gray-800 truncate leading-snug">${escapeHtml(f.roadSegment)}</div>
                        <div class="text-[11px] text-gray-500 truncate mt-1 leading-relaxed">${escapeHtml(summary)}</div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="text-[11px] font-bold tabular-nums ${f.status === 'free' ? 'text-green-600' : f.status === 'occupied' ? 'text-red-600' : 'text-gray-500'}">${f.dist.toFixed(0)}m</div>
                        <div class="text-[10px] uppercase font-semibold tracking-wide ${f.status === 'free' ? 'text-green-500' : f.status === 'occupied' ? 'text-red-500' : 'text-gray-400'} mt-0.5">${f.status}</div>
                    </div>
                `;
                div.addEventListener('click', () => selectBay(f));
                list.appendChild(div);
            });
        }

        // --- Event Listeners ---
        map.on('zoomend moveend', scheduleRender);

        const sheet = document.getElementById('bottom-sheet');
        document.getElementById('sheet-handle').addEventListener('click', () => {
            if (sheet.classList.contains('collapsed')) {
                sheet.classList.replace('collapsed', 'expanded');
            } else {
                sheet.classList.replace('expanded', 'collapsed');
            }
        });

        document.getElementById('btn-back').addEventListener('click', backToOverview);
        document.getElementById('btn-search-back').addEventListener('click', backFromSearch);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                scheduleRender();
            });
        });

        document.getElementById('btn-reload').addEventListener('click', () => {
            if (isReloading) return;
            isReloading = true;
            document.getElementById('btn-reload').disabled = true;
            document.getElementById('reload-icon').style.animation = 'spin 0.8s linear infinite';
            worker.postMessage({ type: 'reload-sensors' });
        });

        document.getElementById('btn-locate').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => setFocusPoint(pos.coords.latitude, pos.coords.longitude), err => {
                    showError('Location access denied. Search for an address instead.', null, 'warn');
                });
            }
        });


        function setFocusPoint(lat, lon, name) {
            focusPoint = L.latLng(lat, lon);
            searchName = name || null;
            focusLayer.clearLayers();
            L.circleMarker(focusPoint, { radius: 10, color: '#57534e', fillColor: '#57534e', fillOpacity: 0.6, weight: 2.5 }).addTo(focusLayer);
            map.flyTo(focusPoint, 18, { duration: 1 });
            
            if (activeBay) backToOverview();
            if (sheet.classList.contains('collapsed')) sheet.classList.replace('collapsed', 'expanded');
            
            if (searchName) {
                showSearchView();
            } else {
                updateNearbyList();
            }
        }

        function showSearchView() {
            document.getElementById('view-overview').classList.add('hidden');
            document.getElementById('view-details').classList.add('hidden');
            document.getElementById('view-search').classList.remove('hidden');
            document.getElementById('view-search').classList.add('view-transition');
            
            const content = document.getElementById('search-location-content');
            const nearby = allFeatures.filter(f => f.centroid && map.distance(focusPoint, L.latLng(f.centroid)) <= 600)
                .map(f => ({ ...f, dist: map.distance(focusPoint, L.latLng(f.centroid)) }))
                .sort((a, b) => a.dist - b.dist);
            
            let nearbyHtml = '';
            if (nearby.length === 0) {
                nearbyHtml = '<div class="text-sm text-gray-500 text-center py-6 bg-gray-50 rounded-xl">No bays found within 600m</div>';
            } else {
                nearbyHtml = '<div class="space-y-2">';
                nearby.slice(0, 15).forEach(f => {
                    const summary = f.restrictions[0] ? f.restrictions[0].structured.split(' • ').slice(0, 2).join(' ') : 'Parking Bay';
                    nearbyHtml += `
                        <div class="p-3 rounded-xl bg-white border border-gray-100 active:bg-gray-50 cursor-pointer transition flex justify-between items-center" data-bay-id="${escapeHtml(f.bayId)}">
                            <div class="flex-1 min-w-0 mr-3">
                                <div class="text-sm font-semibold text-gray-800 truncate">${escapeHtml(f.roadSegment)}</div>
                                <div class="text-xs text-gray-500 truncate mt-0.5">${escapeHtml(summary)}</div>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div class="text-xs font-bold ${f.status === 'free' ? 'text-green-600' : f.status === 'occupied' ? 'text-red-600' : 'text-gray-500'}">${f.dist.toFixed(0)}m</div>
                                <div class="text-[10px] uppercase font-semibold ${f.status === 'free' ? 'text-green-500' : f.status === 'occupied' ? 'text-red-500' : 'text-gray-400'} mt-0.5">${f.status}</div>
                            </div>
                        </div>
                    `;
                });
                nearbyHtml += '</div>';
            }
            
            content.innerHTML = `
                <div class="p-4 bg-stone-50 rounded-2xl border border-stone-200">
                    <div class="flex items-center mb-2 min-w-0">
                        <svg class="w-5 h-5 mr-2 text-stone-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="text-sm font-bold text-gray-800 leading-snug truncate">${escapeHtml(searchName)}</span>
                    </div>
                    <div class="text-[11px] text-gray-500 font-medium tracking-wide tabular-nums">${focusPoint.lat.toFixed(4)}, ${focusPoint.lng.toFixed(4)}</div>
                </div>
                <div>
                    <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Nearby Parking</h3>
                    <div class="text-[10px] text-gray-500 mb-3">Within 600m • ${nearby.length} bays found</div>
                    ${nearbyHtml}
                </div>
            `;
            
            content.querySelectorAll('[data-bay-id]').forEach(el => {
                const bay = nearby.find(f => f.bayId === el.dataset.bayId);
                if (bay) el.addEventListener('click', () => selectBay(bay));
            });
        }

        let searchTimeout, searchAbort;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const q = e.target.value;
            if (searchAbort) searchAbort.abort();
            activeResultIndex = -1;
            
            if (q.length < 3) {
                document.getElementById('search-results').classList.add('hidden');
                document.getElementById('search-input').setAttribute('aria-expanded', 'false');
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                searchAbort = new AbortController();
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=au&q=${encodeURIComponent(q + ', Melbourne, Victoria, Australia')}`, { signal: searchAbort.signal });
                    const data = await res.json();
                    const resultsDiv = document.getElementById('search-results');
                    if (data.length === 0) {
                        resultsDiv.innerHTML = '<div class="p-4 text-sm text-gray-500 text-center">No results found</div>';
                    } else {
                        resultsDiv.innerHTML = data.map((r, i) => `<div role="option" class="p-3 hover:bg-gray-50 cursor-pointer text-sm border-b border-gray-50 last:border-0 truncate" data-lat="${r.lat}" data-lon="${r.lon}">${escapeHtml(r.display_name)}</div>`).join('');
                    }
                    resultsDiv.classList.remove('hidden');
                    document.getElementById('search-input').setAttribute('aria-expanded', 'true');
                    resultsDiv.querySelectorAll('div[data-lat]').forEach(el => {
                        el.addEventListener('click', () => {
                            setFocusPoint(parseFloat(el.dataset.lat), parseFloat(el.dataset.lon), el.textContent.trim());
                            resultsDiv.classList.add('hidden');
                            document.getElementById('search-input').setAttribute('aria-expanded', 'false');
                            document.getElementById('search-input').value = '';
                            document.getElementById('search-input').blur();
                            activeResultIndex = -1;
                        });
                    });
                } catch (e) { if (e.name !== 'AbortError') console.error(e); }
            }, 350);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#search-input') && !e.target.closest('#search-results')) {
                document.getElementById('search-results').classList.add('hidden');
                document.getElementById('search-input').setAttribute('aria-expanded', 'false');
            }
        });

        // --- Keyboard Navigation for Search ---
        let activeResultIndex = -1;
        function updateSearchHighlight() {
            const results = document.getElementById('search-results');
            const items = results.querySelectorAll('div[data-lat]');
            items.forEach((el, i) => {
                el.classList.toggle('search-result-active', i === activeResultIndex);
                if (i === activeResultIndex) el.id = 'search-result-' + i;
                else el.removeAttribute('id');
            });
            if (activeResultIndex >= 0 && items[activeResultIndex]) {
                document.getElementById('search-input').setAttribute('aria-activedescendant', 'search-result-' + activeResultIndex);
                items[activeResultIndex].scrollIntoView({ block: 'nearest' });
            } else {
                document.getElementById('search-input').removeAttribute('aria-activedescendant');
            }
        }

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            const results = document.getElementById('search-results');
            const items = results.querySelectorAll('div[data-lat]');
            if (results.classList.contains('hidden') || items.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                activeResultIndex = Math.min(activeResultIndex + 1, items.length - 1);
                updateSearchHighlight();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                activeResultIndex = Math.max(activeResultIndex - 1, 0);
                updateSearchHighlight();
            } else if (e.key === 'Enter' && activeResultIndex >= 0) {
                e.preventDefault();
                items[activeResultIndex].click();
            } else if (e.key === 'Escape') {
                results.classList.add('hidden');
                document.getElementById('search-input').setAttribute('aria-expanded', 'false');
                activeResultIndex = -1;
            }
        });

        // Reset highlight when results change
        const origSearchInput = document.getElementById('search-input');
        const searchObserver = new MutationObserver(() => { activeResultIndex = -1; });
        searchObserver.observe(document.getElementById('search-results'), { attributes: true, attributeFilter: ['class'] });

        // --- Bottom Sheet Swipe Gesture ---
        let sheetTouchStartY = 0;
        let sheetTouchStartTime = 0;
        let sheetDragging = false;
        let sheetStartTransform = 0;

        sheet.addEventListener('touchstart', (e) => {
            if (e.target.closest('.sheet-content') && e.target.closest('.sheet-content').scrollHeight > e.target.closest('.sheet-content').clientHeight) return;
            sheetTouchStartY = e.touches[0].clientY;
            sheetTouchStartTime = Date.now();
            sheetDragging = false;
            const transform = window.getComputedStyle(sheet).transform;
            const matrix = new DOMMatrixReadOnly(transform);
            sheetStartTransform = matrix.m42;
        }, { passive: true });

        sheet.addEventListener('touchmove', (e) => {
            const deltaY = e.touches[0].clientY - sheetTouchStartY;
            if (!sheetDragging && Math.abs(deltaY) > 8) {
                sheetDragging = true;
                sheet.classList.add('dragging');
            }
            if (!sheetDragging) return;
            const sheetHeight = sheet.offsetHeight;
            const maxTranslate = 0;
            const minTranslate = sheetHeight - 110;
            const newTranslate = Math.max(minTranslate, Math.min(maxTranslate, sheetStartTransform + deltaY));
            sheet.style.transform = 'translateY(' + newTranslate + 'px)';
        }, { passive: true });

        sheet.addEventListener('touchend', (e) => {
            if (!sheetDragging) return;
            sheetDragging = false;
            sheet.classList.remove('dragging');
            const deltaY = (e.changedTouches[0].clientY) - sheetTouchStartY;
            const elapsed = Date.now() - sheetTouchStartTime;
            const velocity = Math.abs(deltaY) / elapsed;
            const sheetHeight = sheet.offsetHeight;
            const currentTranslate = sheetStartTransform + deltaY;
            const midpoint = sheetHeight / 2 - 55;

            if (velocity > 0.3 || (deltaY > 0 && currentTranslate > midpoint)) {
                sheet.classList.replace('expanded', 'collapsed');
                sheet.style.transform = '';
            } else {
                sheet.classList.replace('collapsed', 'expanded');
                sheet.style.transform = '';
            }
        }, { passive: true });

        // Update ARIA on search focus
        document.getElementById('search-input').addEventListener('focus', () => {
            const results = document.getElementById('search-results');
            if (!results.classList.contains('hidden')) {
                document.getElementById('search-input').setAttribute('aria-expanded', 'true');
            }
        });

        init();
        showRandomQuote();
        document.getElementById('loading-logo').innerHTML = costanzaSvg();
        document.getElementById('title-logo').innerHTML = costanzaSvg();
    </script>
</body>
</html>
